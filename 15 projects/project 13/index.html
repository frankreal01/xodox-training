<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter App</title>
    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="container">
        <h1>Currency Converter</h1>

        <form id="converter-form">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0" step="any" value="1" required />
            </div>

            <div class="currency-selection-row">
                <div class="form-group currency-col">
                    <label for="from-currency">From</label>
                    <select id="from-currency" aria-label="From Currency">
                        <!-- Currency options will be inserted from our api -->
                    </select>
                </div>

                <div class="swap-wrapper">
                    <button type="button" id="swap-btn" title="Swap currencies" aria-label="Swap currencies">
                        &#8644;
                    </button>
                </div>

                <div class="form-group currency-col">
                    <label for="to-currency">To</label>
                    <select id="to-currency" aria-label="To Currency">
                        <!-- Currency options will be inserted from our api -->
                    </select>
                </div>
            </div>

            <button type="submit" id="convert-btn">Convert</button>
        </form>

        <div id="rate-info" class="rate-info"></div>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
