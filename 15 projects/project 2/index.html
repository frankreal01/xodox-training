<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Color Palette Generator</h1>
        </header>

        <button id="generate-btn" type="button">
            Generate Palette
            <i class="fas fa-sync-alt" aria-hidden="true"></i>
        </button>

        <section class="palette-container" id="palette-container" aria-label="Generated color palette">
            <article class="color-box">
                <div class="color" style="background-color: #E1F5F3;" aria-label="Color #E1F5F3"></div>
                <div class="color-info">
                    <span class="hex-value">#E1F5F3</span>
                    <button class="copy-btn" type="button" aria-label="Copy color #E1F5F3">
                        <i class="far fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </article>

            <article class="color-box">
                <div class="color" style="background-color: #B3E5FC;" aria-label="Color #B3E5FC"></div>
                <div class="color-info">
                    <span class="hex-value">#B3E5FC</span>
                    <button class="copy-btn" type="button" aria-label="Copy color #B3E5FC">
                        <i class="far fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </article>

            <article class="color-box">
                <div class="color" style="background-color: #81D4FA;" aria-label="Color #81D4FA"></div>
                <div class="color-info">
                    <span class="hex-value">#81D4FA</span>
                    <button class="copy-btn" type="button" aria-label="Copy color #81D4FA">
                        <i class="far fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </article>

            <article class="color-box">
                <div class="color" style="background-color: #4FC3F7;" aria-label="Color #4FC3F7"></div>
                <div class="color-info">
                    <span class="hex-value">#4FC3F7</span>
                    <button class="copy-btn" type="button" aria-label="Copy color #4FC3F7">
                        <i class="far fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </article>

            <article class="color-box">
                <div class="color" style="background-color: #29B6F6;" aria-label="Color #29B6F6"></div>
                <div class="color-info">
                    <span class="hex-value">#29B6F6</span>
                    <button class="copy-btn" type="button" aria-label="Copy color #29B6F6">
                        <i class="far fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
