<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <form id="registration-form">
            <h1>Sign Up</h1>
            <h2>Create your account</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
                <div class="error-message"><small></small></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Enter your email" required>
                <div class="error-message"><small></small></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
                <div class="error-message"><small></small></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm-password" placeholder="Enter your password again" required>
                    <button class="password-toggle" type="button" aria-label="Show confirm password" aria-pressed="false">Show</button>
                </div>
                <div class="error-message"><small></small></div>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
