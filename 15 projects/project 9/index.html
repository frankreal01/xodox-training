<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="form-container">
            <h1>Get in Touch</h1>
            <p>Fill the form below to contact us</p>

            <form id="contact-form" novalidate>
                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required />
                    </div>

                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required />
                    </div>

                    <div class="input-field">
                        <i class="fas fa-phone"></i>
                        <input id="phone" name="phone" type="tel" placeholder="Phone (optional)" autocomplete="tel" />
                    </div>

                    <div class="input-field">
                        <i class="fas fa-tag"></i>
                        <input id="subject" name="subject" type="text" placeholder="Subject" required />
                    </div>
                </div>

                <div class="message-field">
                    <i class="fas fa-message"></i>
                    <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                </div>

                <button type="submit">
                    <div class="btn-content">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane"></i>
                    </div>
                </button>
            </form>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>

            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Awka Anambra State</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>juliusonpurpose@gmail.com</span>
                </div>

                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>+234 812 719 8918</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
